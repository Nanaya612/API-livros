[project]
name = "api_livros"
version = "0.1.0"
description = "catalogo de livros"
authors = [
    {name = "Pedro Américo",email = "pedrobravo1406@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "redis (>=8.1.0,<9.0.0)",
    "uvicorn (>=0.52.2,<0.53.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "fakeredis (>=2.37.1,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx2 (>=2.12.0,<3.0.0)"
]
